<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Chat · Whisper+Me</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e23;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    border: 1px solid rgba(123,47,247,0.25);
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, #14102b, #0b0e23);
  }
  #hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(123,47,247,0.25);
    flex-shrink: 0;
  }
  #hdr .brand { font-weight: 800; font-size: 13px; color: #e6d6ff; text-shadow: 0 0 8px #7a00ff; }
  #hdr .plus  { background: linear-gradient(90deg,#7b2ff7,#00e3ae); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  #hdr .room  { font-size: 11px; color: #999; margin-left: auto; text-align: right; }
  #live-badge {
    display: none; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; color: #ff5c5c;
    background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.4);
    border-radius: 10px; padding: 2px 8px; flex-shrink: 0;
  }
  #live-badge.on { display: flex; }
  #live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff5c5c; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
  .msg .name { font-size: 10px; font-weight: 700; color: #00e3ae; margin-bottom: 2px; }
  .msg.other { align-self: flex-start; background: rgba(255,255,255,0.06); color: #eee; border-bottom-left-radius: 4px; }
  .msg.mine  { align-self: flex-end; background: linear-gradient(135deg,#7b2ff7,#5b1fc7); color: #fff; border-bottom-right-radius: 4px; }
  .msg.mine .name { color: rgba(255,255,255,0.7); }
  #empty { text-align: center; color: #444; font-size: 12px; padding: 24px; }

  #inputbar {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px;
    background: rgba(0,0,0,0.35);
    border-top: 1px solid rgba(123,47,247,0.25);
    flex-shrink: 0;
  }
  #inputbar input {
    flex: 1; padding: 10px 14px; border-radius: 20px;
    border: 1px solid #2a2a2a; background: rgba(255,255,255,0.07);
    color: #fff; font-size: 13px; outline: none;
  }
  #inputbar input::placeholder { color: #555; }
  #inputbar button {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: none; background: linear-gradient(90deg,#7b2ff7,#00e3ae);
    color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #inputbar button:disabled { opacity: 0.5; cursor: default; }

  #cta {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 14px;
    background: rgba(123,47,247,0.1);
    border-top: 1px solid rgba(123,47,247,0.2);
    flex-shrink: 0;
  }
  #cta span { font-size: 11px; color: #bbb; }
  #cta a {
    font-size: 11px; font-weight: 700; color: #fff; text-decoration: none;
    background: linear-gradient(90deg,#7b2ff7,#00e3ae);
    padding: 6px 12px; border-radius: 14px; white-space: nowrap;
  }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b0e23; color: #888; font-size: 13px; z-index: 10;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="loading">Connecting to the room…</div>
  <div id="hdr">
    <span class="brand">Whisper<span class="plus">+</span>Me</span>
    <span id="live-badge"><span id="live-dot"></span>LIVE</span>
    <span class="room" id="roomLabel"></span>
  </div>
  <div id="msgs"><div id="empty">No messages yet — say hi!</div></div>
  <div id="inputbar">
    <input id="msgInput" placeholder="Message this room…" maxlength="300" autocomplete="off">
    <button id="sendBtn" aria-label="Send">▶</button>
  </div>
  <div id="cta">
    <span id="ctaLabel">Guest chat &middot; free forever</span>
    <a href="#" id="continueLink" target="_blank" rel="noopener">Open full site →</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app-check.js"></script>
<script src="firebase.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js" defer></script>

<script>
(function(){
  var AGORA_APP_ID = "605c4549677d4f91b07bfb36df7cd30c";
  var CF_BASE      = "https://us-central1-whisperplusme-46d9c.cloudfunctions.net";

  var params = new URLSearchParams(window.location.search);
  var room   = (params.get("room") || "general").replace(/[^a-z0-9_]/gi, "") || "general";
  var roomLabels = {
    general:"General", vent:"Vent & Release", anxiety:"Anxiety & Stress",
    nightowls:"Night Owls", grief:"Grief & Loss", mentalhealth:"Mental Health",
    voices:"Live Voices", connection:"Real Connection",
    creators:"Creators Lounge",
    lgbt_safe:"LGBTQ+ Safe Space", lgbt_chat:"Queer Connect", lgbt_youth:"Rainbow 18–25",
    psychics:"Psychic Circle", astrology:"Astrology Lounge", tarot:"Tarot & Palm Reading",
    apothecary:"The Apothecary"
  };
  document.getElementById("roomLabel").textContent = roomLabels[room] || room;
  document.getElementById("continueLink").href = "https://whisperplusme.com/?room=" + encodeURIComponent(room);

  function sanitize(str){
    return String(str||"")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function guestName(){
    var g = null;
    try { g = sessionStorage.getItem("wpm_guest_name"); } catch(e) {}
    if(!g){
      g = "Guest" + Math.floor(1000 + Math.random()*9000);
      try { sessionStorage.setItem("wpm_guest_name", g); } catch(e) {}
    }
    return g;
  }

  var myUid = null, myName = guestName(), myIsMember = false;
  var msgsEl = document.getElementById("msgs");
  var input  = document.getElementById("msgInput");
  var sendBtn = document.getElementById("sendBtn");

  function renderMessages(list){
    msgsEl.innerHTML = "";
    if(!list || !list.length){
      msgsEl.innerHTML = "<div id='empty'>No messages yet — say hi!</div>";
      return;
    }
    list.forEach(function(m){
      if(!m || m.type === "promo") return; /* skip promo cards in the mini widget */
      var row = document.createElement("div");
      row.className = "msg " + (m.uid === myUid ? "mine" : "other");
      row.innerHTML = "<div class='name'>" + sanitize(m.name||"User") + "</div>" + sanitize(m.text||"");
      msgsEl.appendChild(row);
    });
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function sendMessage(){
    var text = (input.value||"").trim();
    if(!text || text.length > 300 || !myUid) return;
    input.value = "";
    firebase.database().ref("chat/" + room).push({
      uid: myUid, name: myName, photo: "", text: text, type: "text", ts: Date.now()
    }).catch(function(e){ console.error(e); });
  }
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") sendMessage(); });

  /* ── Live mic audience listening ── */
  var audienceClient = null;
  function fetchAgoraToken(channel){
    return firebase.auth().currentUser.getIdToken().then(function(idToken){
      return fetch(CF_BASE + "/generateAgoraToken?channel=" + encodeURIComponent(channel) + "&uid=0", {
        headers: { Authorization: "Bearer " + idToken }
      }).then(function(r){ return r.json(); }).then(function(d){ return d.token; });
    });
  }
  function startListening(){
    if(audienceClient || typeof AgoraRTC === "undefined") return;
    audienceClient = AgoraRTC.createClient({ mode:"rtc", codec:"vp8" });
    audienceClient.on("user-published", function(remoteUser, mediaType){
      audienceClient.subscribe(remoteUser, mediaType).then(function(){
        if(mediaType === "audio"){
          AgoraRTC.resumeAudioContext().catch(function(){});
          remoteUser.audioTrack.play();
        }
      });
    });
    fetchAgoraToken("livemic_" + room).then(function(token){
      return audienceClient.join(AGORA_APP_ID, "livemic_" + room, token, null);
    }).catch(function(e){ console.warn("listen join failed", e); audienceClient = null; });
  }
  function stopListening(){
    if(!audienceClient) return;
    audienceClient.leave().catch(function(){});
    audienceClient = null;
  }
  function watchLiveMic(){
    firebase.database().ref("liveMics/" + room).on("value", function(snap){
      var active = false;
      snap.forEach(function(c){ if(c.val() && c.val().active) active = true; });
      document.getElementById("live-badge").classList.toggle("on", active);
      if(active) startListening(); else stopListening();
    });
  }

  function boot(){
    document.getElementById("loading").style.display = "none";
    if(myIsMember){
      var ctaLabel = document.getElementById("ctaLabel");
      if(ctaLabel) ctaLabel.textContent = "Signed in as " + myName;
    }
    firebase.database().ref("chat/" + room).limitToLast(50).on("value", function(snap){
      var list = [];
      snap.forEach(function(c){ list.push(c.val()); });
      renderMessages(list);
    });
    watchLiveMic();
  }

  firebase.auth().onAuthStateChanged(function(user){
    if(!user){
      firebase.auth().signInAnonymously().catch(function(e){
        document.getElementById("loading").textContent = "Couldn't connect — refresh to try again.";
        console.error(e);
      });
      return;
    }
    myUid = user.uid;
    if(!user.isAnonymous){
      /* Already logged in as a full member on this browser — use their
         real profile instead of a guest handle. */
      myIsMember = true;
      firebase.database().ref("users/" + user.uid).once("value").then(function(snap){
        var profile = snap.val() || {};
        myName = profile.name || myName;
        boot();
      }).catch(function(){ boot(); });
    } else {
      boot();
    }
  });
})();
</script>

</body>
</html>
